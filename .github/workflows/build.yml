name: Build distribution with Webpack

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Required so the built bundle can be pushed back to main.
permissions:
  contents: write

jobs:
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Distribution
        run: npm run build

      # On pull requests the build result is only a check that the sources
      # compile; dist/ is rebuilt and committed once the change reaches main.
      - name: Commit Distribution Build
        if: github.event_name == 'push'
        env:
          CI_COMMIT_AUTHOR: 'CI Bot'
          CI_COMMIT_EMAIL: 'ci@noreply.github.com'
          CI_COMMIT_MESSAGE: 'Continuous Integration - Build Distribution'
        run: |
          git config user.name "${CI_COMMIT_AUTHOR}"
          git config user.email "${CI_COMMIT_EMAIL}"
          git add dist
          if git diff --staged --quiet; then
            echo "Distribution is already up to date."
          else
            git commit -m "${CI_COMMIT_MESSAGE}"
            git push
          fi
